name: UI Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:          # adds a manual "Run workflow" button

permissions:
  contents: read

concurrency:                  # a newer push cancels an older run on the same branch
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
      SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode clean test -Dbrowser=chrome -Dheadless=true

      - name: Set up Node (for the Allure CLI)
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure generate target/allure-results --clean -o allure-report

      - name: Upload raw results, screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            target/allure-results
            target/screenshots
            target/logs
          if-no-files-found: ignore

      - name: Package report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5